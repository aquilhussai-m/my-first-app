<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aquil</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #1f2937;
    }

    h1 {
      font-size: 5rem;
      margin: 0 0 30px;
      letter-spacing: 4px;
    }

    button {
      font-size: 1.3rem;
      padding: 14px 36px;
      border: none;
      border-radius: 40px;
      color: white;
      background: linear-gradient(90deg, #ff6b6b, #f7b733, #4facfe);
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
      transition: transform 0.15s;
    }

    button:hover {
      transform: scale(1.07);
    }

    #message {
      margin-top: 30px;
      font-size: 2.5rem;
      font-weight: bold;
      color: #e63946;
      min-height: 3rem;
    }
  </style>
</head>
<body>
  <h1>AQUIL</h1>
  <button onclick="sayHello()">यहाँ दबाओ</button>
  <p id="message"></p>

  <script>
    function sayHello() {
      document.getElementById("message").textContent = "Hello!";
    }
  </script>
</body>
</html>
